<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAFA">
<title>证件照工具</title>
<meta name="description" content="免费在线证件照制作：拖动构图、MODNet 高精度抠图换底色、智能磨皮、规范校验。照片全部在浏览器本地处理，不上传服务器。">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ==================== 启动页 ==================== -->
<div class="boot" id="boot">
  <div class="boot-card">
    <h1 class="boot-title">证件照工具</h1>
    <p class="boot-sub" id="bootStage">正在准备模型…</p>
    <div class="boot-rows" id="bootRows"></div>
    <p class="boot-err" id="bootErr" hidden></p>
    <div class="boot-actions">
      <button type="button" class="btn btn-primary btn-lg" id="bootEnter" hidden>进入</button>
      <button type="button" class="btn btn-ghost btn-lg" id="bootRetry" hidden>重试</button>
    </div>
    <p class="boot-privacy">照片全部在本地处理，不会上传</p>
  </div>
</div>

<!-- ==================== 主界面 ==================== -->
<div class="app" id="app" hidden>

  <header class="apphead">
    <h1 class="apphead-title">证件照工具</h1>
    <span class="apphead-privacy">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      本地处理，不上传
    </span>
  </header>

  <!-- 显示区 -->
  <section class="display" id="display">

    <!-- 状态 1：未上传 -->
    <div class="uploadbox" id="uploadBox">
      <div class="uploadbox-inner">
        <svg class="uploadbox-icon" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/>
        </svg>
        <p class="uploadbox-title">点击上传照片</p>
        <p class="uploadbox-sub">支持 JPG / PNG / HEIC，或直接拍照</p>
        <div class="uploadbox-actions">
          <button type="button" class="btn btn-primary" id="pickBtn">选择照片</button>
          <button type="button" class="btn btn-ghost" id="shootBtn">拍照</button>
        </div>
        <p class="hint">上传照片 → 选规格 → 下载</p>
      </div>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/*" hidden>
      <input type="file" id="camInput" accept="image/*" capture="user" hidden>
    </div>

    <!-- 状态 2：已上传 -->
    <div class="viewwrap" id="viewwrap" hidden>
      <canvas id="viewCanvas"></canvas>
      <div class="viewtools">
        <div class="seg" id="viewMode">
          <button type="button" class="seg-btn is-on" data-mode="adjust">构图</button>
          <button type="button" class="seg-btn" data-mode="result">看效果</button>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="resetFit">重置取景</button>
      </div>
      <button type="button" class="peek" id="peekBtn">对比原图</button>
      <div class="chip-busy" id="busyChip" hidden><span class="spinner dark"></span><span id="busyText">处理中…</span></div>
      <div class="viewhint" id="viewHint">拖动移动取景框 · 滚轮 / 双指缩放</div>
    </div>
    <p class="viewmeta" id="cropMeta" hidden></p>

    <p class="notice" id="uploadNotice" hidden></p>
  </section>

  <!-- 校验概要行（仅状态 2） -->
  <button type="button" class="sumbar" id="sumBar" hidden>
    <span class="sumbar-icon" id="sumIcon"></span>
    <span class="sumbar-text" id="sumText"></span>
    <span class="sumbar-arrow" aria-hidden="true">›</span>
  </button>

  <!-- 操作区 -->
  <div class="controls" id="controls">

    <section class="group">
      <h2 class="group-title">规格</h2>
      <div class="tabs" id="specTabs"></div>
      <div class="spec-scroll" id="specScroll">
        <div class="spec-row" id="specRow"></div>
        <span class="spec-fade" id="specFade" aria-hidden="true"></span>
      </div>
      <p class="hint" id="specHint"></p>
      <div class="custom-spec" id="customSpec" hidden>
        <div class="seg" id="customUnit">
          <button type="button" class="seg-btn is-on" data-unit="mm">毫米</button>
          <button type="button" class="seg-btn" data-unit="px">像素</button>
        </div>
        <div class="custom-fields">
          <label>宽<input type="number" id="cw" value="25" min="1" step="1"></label>
          <label>高<input type="number" id="ch" value="35" min="1" step="1"></label>
          <button type="button" class="btn btn-ghost btn-sm" id="applyCustom">应用</button>
        </div>
        <p class="hint">毫米按 300 DPI 换算（1mm ≈ 11.81px）；构图用默认参数</p>
      </div>
    </section>

    <hr class="sep">

    <section class="group">
      <h2 class="group-title">背景色</h2>
      <div class="swatches" id="swatches"></div>
      <label class="inline-field">自定义底色
        <input type="color" id="bgCustom" value="#FFFFFF">
      </label>
      <p class="hint" id="matteHint">抠图引擎：MODNet</p>
    </section>

    <hr class="sep">

    <section class="group">
      <h2 class="group-title">磨皮强度</h2>
      <div class="slider-row">
        <label for="intenSlider">强度</label>
        <input type="range" id="intenSlider" min="0" max="30" step="1" value="22">
        <output id="intenOut">22%</output>
      </div>
      <div class="slider-row">
        <label for="radiusSlider">平滑半径</label>
        <input type="range" id="radiusSlider" min="1" max="5" step="1" value="3">
        <output id="radiusOut">3px</output>
      </div>
      <p class="hint" id="mopiHint">只作用于人脸区域，上限 30%</p>
    </section>

    <hr class="sep">

    <section class="group">
      <h2 class="group-title">目标文件大小</h2>
      <div class="chips" id="sizeChips"></div>
      <p class="hint" id="sizeHint">按目标大小自动调节 JPEG 质量（0.92 → 0.65）</p>
    </section>

    <div class="actionrow">
      <button type="button" class="btn btn-ghost" id="applyBgBtn">换背景</button>
      <button type="button" class="btn btn-primary" id="downloadBtn">下载</button>
    </div>
    <button type="button" class="btn btn-ghost btn-block" id="resetBtn">重新上传</button>

    <p class="notice" id="exportNotice" hidden></p>
    <div class="progress" id="progress" hidden><i id="progressFill"></i><span id="progressText"></span></div>
  </div>
</div>

<!-- ==================== 校验详情浮层 ==================== -->
<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="规范校验详情">
    <div class="modal-head">
      <h3>规范校验</h3>
      <button type="button" class="modal-x" id="modalClose" aria-label="关闭">✕</button>
    </div>
    <ul class="checks" id="checks"></ul>
    <p class="notice" id="checkNotice" hidden></p>
    <button type="button" class="btn btn-primary btn-lg" id="modalDownload">下载证件照</button>
  </div>
</div>

<script src="data/specs.js"></script>
<script src="js/preload.js"></script>
<script src="js/faceDetect.js"></script>
<script src="js/bgRemove.js"></script>
<script src="js/mopi.js"></script>
<script src="js/crop.js"></script>
<script src="js/compliance.js"></script>
<script src="js/export.js"></script>
<script src="js/main.js"></script>
</body>
</html>
